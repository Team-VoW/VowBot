bot:
  token: ${BOT_TOKEN}

api:
  # One bearer key for every bot -> API call. The .NET side validates it as DISCORD_BOT_API_KEY;
  # the env var keeps its original name so deployed .env files do not have to change.
  key: ${DISCORD_INTEGRATION_API_KEY}

sql:
  url: ${SQL_URL}
  username: ${SQL_USERNAME}
  password: ${SQL_PASSWORD}
